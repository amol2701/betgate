<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#111819">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bet Gate</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#111819; --panel:#182124; --panel2:#1E292D; --line:#2B383D;
    --ink:#E6EDEE; --muted:#8FA3A8; --dim:#63787E;
    --pass:#4FB477; --block:#E05A4D; --hold:#D8A441;
    --r:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--ink); overscroll-behavior-y:contain}
  body{
    font-family:"Inter","Segoe UI",Roboto,system-ui,sans-serif;
    max-width:460px; margin:0 auto; font-size:15px; line-height:1.45;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom));
    -webkit-user-select:none; user-select:none;
  }
  input,select,textarea{-webkit-user-select:text; user-select:text}
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-0.01em}
  button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--hold); outline-offset:2px}
  input,select{
    font-family:inherit; font-size:16px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:11px; width:100%; appearance:none;
  }
  .row{display:flex; gap:8px; align-items:center}
  .grow{flex:1}
  .dim{color:var(--dim); font-size:12.5px}

  .tabs{display:flex; gap:4px; background:var(--panel); padding:4px; border-radius:12px; margin-bottom:14px}
  .tab{flex:1; padding:10px 0; text-align:center; border-radius:9px; color:var(--muted); font-size:14px; font-weight:500}
  .tab[aria-selected="true"]{background:var(--panel2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}

  .hero{border-radius:14px; padding:18px 16px; margin-bottom:14px; background:var(--panel); border-left:5px solid var(--dim)}
  .hero.pass{border-left-color:var(--pass); background:linear-gradient(180deg,rgba(79,180,119,.10),transparent 70%),var(--panel)}
  .hero.block{border-left-color:var(--block); background:linear-gradient(180deg,rgba(224,90,77,.10),transparent 70%),var(--panel)}
  .hero.hold{border-left-color:var(--hold)}
  .hero.closed{border-left-color:var(--block); background:linear-gradient(180deg,rgba(224,90,77,.18),transparent 80%),var(--panel)}
  .verdict{font-size:27px; font-weight:650; letter-spacing:-0.02em; margin-bottom:3px}
  .verdict.pass{color:var(--pass)} .verdict.block{color:var(--block)} .verdict.hold{color:var(--hold)}
  .why{font-size:13.5px; color:var(--muted)}
  .why b{color:var(--ink); font-weight:600}

  .strip{display:flex; gap:8px; margin-bottom:6px}
  .cell{flex:1; background:var(--panel); border-radius:10px; padding:10px; min-width:0}
  .cell .k{font-size:11.5px; color:var(--dim); margin-bottom:2px}
  .cell .v{font-size:17px; font-weight:600; letter-spacing:-0.01em}
  .cell .v.n{color:var(--block)}
  .bar{height:3px; border-radius:2px; background:var(--line); margin-top:7px; overflow:hidden}
  .bar i{display:block; height:100%; background:var(--pass); transition:width .25s}
  .bar i.hot{background:var(--hold)} .bar i.over{background:var(--block)}

  .sect{font-size:12.5px; color:var(--dim); margin:16px 2px 8px}
  .check{background:var(--panel); border-radius:var(--r); padding:12px; margin-bottom:7px; border:1px solid transparent; transition:border-color .15s}
  .check.no{border-color:rgba(224,90,77,.5)}
  .check.yes{border-color:rgba(79,180,119,.28)}
  .check .q{font-size:14.5px}
  .check .note{font-size:12.5px; color:var(--muted); margin-top:8px}
  .yn{display:flex; gap:7px; margin-top:10px}
  .yn button{flex:1; padding:11px 0; border-radius:8px; background:var(--panel2); color:var(--muted); font-weight:500; font-size:14px; box-shadow:inset 0 0 0 1px var(--line)}
  .yn button[aria-pressed="true"].y{background:rgba(79,180,119,.16); color:var(--pass); box-shadow:inset 0 0 0 1px rgba(79,180,119,.5)}
  .yn button[aria-pressed="true"].n{background:rgba(224,90,77,.16); color:var(--block); box-shadow:inset 0 0 0 1px rgba(224,90,77,.5)}
  .auto{font-size:12px; padding:3px 8px; border-radius:20px; background:var(--panel2); color:var(--muted); white-space:nowrap}
  .auto.pass{color:var(--pass)} .auto.fail{color:var(--block)}

  .btn{display:block; width:100%; padding:15px; border-radius:11px; font-weight:600; text-align:center; font-size:15px}
  .btn.go{background:var(--pass); color:#0C1512}
  .btn.stop{background:rgba(224,90,77,.14); color:var(--block); box-shadow:inset 0 0 0 1px rgba(224,90,77,.45)}
  .btn.ghost{background:var(--panel); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line); font-weight:500}
  .btn[disabled]{opacity:.42}
  .btn.sm{padding:9px; font-size:13.5px; border-radius:9px}

  .entry{background:var(--panel); border-radius:var(--r); padding:11px 12px; margin-bottom:7px; border-left:3px solid var(--line)}
  .entry.won{border-left-color:var(--pass)} .entry.lost{border-left-color:var(--block)}
  .entry.blocked{border-left-color:var(--hold)}
  .entry .top{display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .entry .m{font-weight:600; font-size:14.5px}
  .entry .r{font-size:13px; color:var(--muted); margin-top:4px; font-style:italic}
  .pnl{font-weight:650; font-size:15px; white-space:nowrap}
  .pnl.p{color:var(--pass)} .pnl.n{color:var(--block)}
  .empty{text-align:center; color:var(--dim); padding:36px 20px; font-size:14px}

  .veil{position:fixed; inset:0; background:rgba(6,10,11,.75); display:flex; align-items:flex-end; justify-content:center; z-index:50; padding:12px}
  .sheet{background:var(--panel); border-radius:16px; padding:16px; width:100%; max-width:436px; border:1px solid var(--line); margin-bottom:env(safe-area-inset-bottom)}
  .sheet h3{font-size:17px; margin-bottom:5px}
  .field{margin-bottom:10px}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px}
  .toast{position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); background:var(--panel2); color:var(--ink); box-shadow:0 0 0 1px var(--line); padding:13px 14px; border-radius:11px; font-size:13.5px; z-index:60; max-width:436px; margin:0 auto}
  .toast.bad{background:var(--block); color:#fff; box-shadow:none}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-tab="gate">Gate</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="log">Log</button>
  <button class="tab" role="tab" aria-selected="false" data-tab="rules">Rules</button>
</div>

<div id="view"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
const KEY = "betgate_v1";
const D = {
  settings:{
    perMatchCap: 7000,      // total exposure allowed on one match
    maxMatchesPerDay: 2,    // distinct matches you may trade in a day
    lossStopCount: 2,       // day closes after this many losing bets
    dailyLossCap: 14000,    // ...or after this much lost, whichever comes first
    monthlyLimit: 60000,    // monthly drawdown ceiling
    sessionAllowed: false
  },
  bets:[], blocks:[]
};
let S = JSON.parse(JSON.stringify(D));
let tab = "gate";
let answers = {};
let draft = { stake:"", market:"Match odds", match:"", reason:"" };

/* ---------- storage ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const p = JSON.parse(raw);
      S = Object.assign(JSON.parse(JSON.stringify(D)), p);
      S.settings = Object.assign(JSON.parse(JSON.stringify(D.settings)), p.settings||{});
    }
  }catch(e){ toast("Couldn't read saved data. Restore from a backup in Rules if you have one.", true); }
}
function save(){
  const body = JSON.stringify(S);
  try{ localStorage.setItem(KEY, body); return true; }
  catch(e){
    try{ localStorage.setItem(KEY, body); return true; }
    catch(e2){ toast("Save failed. Export a backup from Rules before closing.", true); return false; }
  }
}
function toast(msg, bad){
  const t = document.getElementById("toast");
  t.innerHTML = '<div class="toast'+(bad?' bad':'')+'">'+msg+'</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.innerHTML=""; }, 5500);
}

/* ---------- helpers ---------- */
const money = n => "\u20B9" + Math.round(n).toLocaleString("en-IN");
const dayKey = d => { const x = d?new Date(d):new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const monKey = d => dayKey(d).slice(0,7);
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function stats(){
  const td = dayKey(), tm = monKey(), st = S.settings;
  const todayBets   = S.bets.filter(b=>b.day===td);
  const todayLosses = todayBets.filter(b=>b.result==="LOST");
  const lostAmount  = todayLosses.reduce((a,b)=>a+Math.abs(b.pnl||0),0);
  const todayPnl    = todayBets.reduce((a,b)=>a+(b.pnl||0),0);
  const matchesToday= [...new Set(todayBets.map(b=>norm(b.match)))];
  const openBets    = S.bets.filter(b=>!b.result);
  const monthPnl    = S.bets.filter(b=>b.day.startsWith(tm)).reduce((a,b)=>a+(b.pnl||0),0);
  const monthDown   = Math.max(0, -monthPnl);
  const todayBlocks = S.blocks.filter(b=>b.day===td).length;

  const closedByCount  = todayLosses.length >= st.lossStopCount;
  const closedByAmount = lostAmount >= st.dailyLossCap;
  return { td, todayBets, todayLosses:todayLosses.length, lostAmount, todayPnl,
           matchesToday, openBets, monthDown, todayBlocks, closedByCount, closedByAmount,
           dayClosed: closedByCount || closedByAmount };
}

/* exposure already committed on the match being entered */
function matchExposure(){
  const n = norm(draft.match);
  if(!n) return 0;
  return S.bets.filter(b=>b.day===dayKey() && norm(b.match)===n).reduce((a,b)=>a+(b.stake||0),0);
}

/* ---------- checks ---------- */
function buildChecks(){
  const s = stats(), st = S.settings;
  const stake = parseFloat(draft.stake)||0;
  const exp = matchExposure();
  const isNewMatch = draft.match.trim() && !s.matchesToday.includes(norm(draft.match));

  return [
    { id:"c1", auto:true, q:"Day still open",
      pass: !s.dayClosed,
      note: s.dayClosed
        ? (s.closedByAmount ? "Closed \u2014 " + money(s.lostAmount) + " lost, cap is " + money(st.dailyLossCap)
                            : "Closed \u2014 " + s.todayLosses + " losing bets, stop is " + st.lossStopCount)
        : s.todayLosses + "/" + st.lossStopCount + " losses \u00B7 " + money(s.lostAmount) + " of " + money(st.dailyLossCap) },

    { id:"c2", auto:true, q:"Nothing left unsettled",
      pass: s.openBets.length === 0,
      note: s.openBets.length ? s.openBets.length + " bet(s) waiting to be settled in the Log" : "All settled" },

    { id:"c3", auto:true, q:"Within the daily match count",
      pass: !isNewMatch || s.matchesToday.length < st.maxMatchesPerDay,
      note: s.matchesToday.length + " of " + st.maxMatchesPerDay + " matches traded today" },

    { id:"c4", auto:true, q:"Exposure on this match within " + money(st.perMatchCap),
      pass: draft.match.trim().length>0 && stake>0 && (exp + stake) <= st.perMatchCap,
      note: !draft.match.trim() ? "Enter the match above"
          : stake<=0 ? "Enter a stake above"
          : exp>0 ? money(exp)+" already on this match, this takes it to "+money(exp+stake)
          : money(stake)+" of "+money(st.perMatchCap) },

    { id:"c5", auto:true,
      q: st.sessionAllowed ? "Session stake within cap" : "Not a session market",
      pass: draft.market !== "Session" ? true : (st.sessionAllowed && stake>0 && (exp+stake) <= st.perMatchCap),
      note: draft.market === "Session"
        ? (st.sessionAllowed ? "Session allowed, counted against the match cap" : "Sessions are switched off in your rules")
        : "Market: " + draft.market },

    { id:"c6", auto:true, q:"Month still inside limit",
      pass: (s.monthDown + stake) <= st.monthlyLimit,
      note: money(s.monthDown) + " down this month of " + money(st.monthlyLimit) },

    { id:"c7", auto:true, q:"Reason written down before placing",
      pass: draft.reason.trim().length >= 15,
      note: draft.reason.trim().length >= 15 ? "Recorded" : "Needs at least a full sentence" },

    { id:"c8", auto:false, q:"I can name both likely XIs and how this venue plays \u2014 without looking it up now",
      note:"If you can't, you don't have an edge. You have a screen." },

    { id:"c9", auto:false, q:"I'm calm, unhurried, and sober right now",
      note:"Tilt, rush, and drink each cost more than any bad read." }
  ];
}
function evaluate(checks){
  const failed = checks.filter(c => c.auto ? !c.pass : answers[c.id] !== true);
  const hardNo = checks.some(c => (!c.auto && answers[c.id] === false) || (c.auto && !c.pass));
  return { failed, open: failed.length===0, hardNo };
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.tab===tab));
  document.getElementById("view").innerHTML = tab==="gate" ? gateView() : tab==="log" ? logView() : rulesView();
  wire();
}

function meters(s){
  const st = S.settings;
  const lossPct = Math.min(100, s.lostAmount / st.dailyLossCap * 100);
  const lcls = lossPct>=100?"over":lossPct>50?"hot":"";
  const monPct = Math.min(100, s.monthDown / st.monthlyLimit * 100);
  const mcls = monPct>85?"over":monPct>60?"hot":"";
  return `
  <div class="strip">
    <div class="cell"><div class="k">Today</div><div class="v ${s.todayPnl<0?'n':''}">${s.todayPnl>=0?"+":""}${money(s.todayPnl)}</div></div>
    <div class="cell"><div class="k">Matches</div><div class="v">${s.matchesToday.length}/${st.maxMatchesPerDay}</div></div>
    <div class="cell"><div class="k">Stopped</div><div class="v">${s.todayBlocks}</div></div>
  </div>
  <div class="strip" style="margin-top:8px">
    <div class="cell">
      <div class="k">Lost today \u00B7 stop ${money(st.dailyLossCap)}</div>
      <div class="v ${lossPct>=100?'n':''}">${money(s.lostAmount)}</div>
      <div class="bar"><i class="${lcls}" style="width:${lossPct}%"></i></div>
    </div>
    <div class="cell">
      <div class="k">Month \u00B7 limit ${money(st.monthlyLimit)}</div>
      <div class="v ${monPct>=100?'n':''}">${money(s.monthDown)}</div>
      <div class="bar"><i class="${mcls}" style="width:${monPct}%"></i></div>
    </div>
  </div>`;
}

function gateView(){
  const s = stats();

  if(s.dayClosed){
    const reason = s.closedByAmount
      ? money(s.lostAmount) + " lost today. Your cap is " + money(S.settings.dailyLossCap) + "."
      : s.todayLosses + " losing bets today. Your stop is " + S.settings.lossStopCount + ".";
    return `
    <div class="hero closed">
      <div class="verdict block">Day closed</div>
      <div class="why">${reason} The gate reopens tomorrow.</div>
    </div>
    ${meters(s)}
    <div class="check" style="margin-top:14px">
      <div class="q">Nothing to decide now.</div>
      <div class="note">This is the rule you set when you were thinking clearly. It is doing exactly what you built it to do. Close the app, put the phone down, and come back tomorrow.</div>
    </div>
    <button class="btn stop" id="stopped" style="margin-top:8px">I wanted to bet anyway \u2014 record it</button>
    <div class="dim" style="text-align:center; margin-top:12px">Logging the urge is worth more than logging the bet.</div>`;
  }

  const checks = buildChecks(), r = evaluate(checks);
  const cls  = r.open ? "pass" : (r.hardNo ? "block" : "hold");
  const word = r.open ? "Gate open" : (r.hardNo ? "Blocked" : "Not cleared");
  const why  = r.open ? "Every check passed. This one is inside your rules."
             : r.failed.length ? "Failed: <b>" + r.failed.map(c=>c.q.split("\u2014")[0].trim()).join("</b>, <b>") + "</b>"
             : "Answer the remaining checks.";

  return `
  <div class="hero ${cls}">
    <div class="verdict ${cls}">${word}</div>
    <div class="why">${why}</div>
  </div>
  ${meters(s)}

  <div class="sect">The bet</div>
  <div class="check">
    <div class="field"><label>Match \u2014 exposure is tracked per match</label>
      <input id="f-match" value="${esc(draft.match)}" placeholder="e.g. MI v CSK"></div>
    <div class="row" style="margin-bottom:10px; align-items:flex-end">
      <div class="grow"><label class="dim" style="display:block;margin-bottom:5px">Market</label>
        <select id="f-market">${["Match odds","Runline","Live trade","Session","Other"].map(m=>`<option ${draft.market===m?"selected":""}>${m}</option>`).join("")}</select></div>
      <div class="grow"><label class="dim" style="display:block;margin-bottom:5px">Stake</label>
        <input id="f-stake" inputmode="numeric" value="${esc(draft.stake)}" placeholder="0"></div>
    </div>
    <div class="field" style="margin:0"><label>Why this bet \u2014 written before you place it</label>
      <input id="f-reason" value="${esc(draft.reason)}" placeholder="One sentence. What's the edge?"></div>
  </div>

  <div class="sect">Pre-flight checks</div>
  ${checks.map(c=>{
    const st = c.auto ? (c.pass?"yes":"no") : (answers[c.id]===true?"yes":answers[c.id]===false?"no":"");
    return `<div class="check ${st}">
      <div class="row" style="align-items:flex-start; gap:10px">
        <div class="q grow">${c.q}</div>
        ${c.auto?`<span class="auto ${c.pass?'pass':'fail'}">${c.pass?"pass":"fail"}</span>`:""}
      </div>
      ${c.auto?"":`<div class="yn">
        <button class="y" data-yn="${c.id}" data-val="1" aria-pressed="${answers[c.id]===true}">Yes</button>
        <button class="n" data-yn="${c.id}" data-val="0" aria-pressed="${answers[c.id]===false}">No</button>
      </div>`}
      <div class="note">${c.note||""}</div>
    </div>`;
  }).join("")}

  <div style="margin-top:16px">
    ${r.open ? `<button class="btn go" id="place">Log this bet and place it</button>`
             : `<button class="btn go" disabled>Log this bet and place it</button>
                <div style="height:8px"></div>
                <button class="btn stop" id="stopped">I did not place it \u2014 record the stop</button>`}
  </div>
  <div class="dim" style="text-align:center; margin-top:12px">Settle every bet in the Log. The day can't close if the app doesn't know you lost.</div>`;
}

function logView(){
  const items = [...S.bets.map(b=>({...b,kind:"bet"})), ...S.blocks.map(b=>({...b,kind:"block"}))]
    .sort((a,b)=>b.ts-a.ts).slice(0,80);
  const settled = S.bets.filter(b=>b.result);
  const wins = settled.filter(b=>b.result==="WON").length;
  const all = S.bets.reduce((a,b)=>a+(b.pnl||0),0);
  const stops = S.blocks.length;
  const rate = (S.bets.length+stops) ? Math.round(stops/(S.bets.length+stops)*100) : 0;

  return `
  <div class="strip">
    <div class="cell"><div class="k">All time</div><div class="v ${all<0?'n':''}">${all>=0?"+":""}${money(all)}</div></div>
    <div class="cell"><div class="k">Settled</div><div class="v">${wins}/${settled.length}</div></div>
    <div class="cell"><div class="k">Stops</div><div class="v">${stops} \u00B7 ${rate}%</div></div>
  </div>
  <div style="height:8px"></div>
  ${items.length===0 ? `<div class="empty">Nothing logged yet. Every bet and every stop lands here.</div>` :
  items.map(it => it.kind==="block"
    ? `<div class="entry blocked">
         <div class="top"><div class="m">Stopped by the gate</div><div class="dim">${it.day}</div></div>
         <div class="r">${esc(it.failed||"\u2014")}</div>
         ${it.stake?`<div class="dim" style="margin-top:3px">${money(it.stake)} not staked</div>`:""}
       </div>`
    : `<div class="entry ${it.result==='WON'?'won':it.result==='LOST'?'lost':''}">
         <div class="top">
           <div class="m">${esc(it.match||"Untitled")} <span class="dim">\u00B7 ${esc(it.market)}</span></div>
           ${it.result ? `<div class="pnl ${it.pnl>=0?'p':'n'}">${it.pnl>=0?"+":""}${money(it.pnl)}</div>`
                       : `<button class="btn sm ghost" style="width:auto;padding:6px 11px" data-settle="${it.id}">Settle</button>`}
         </div>
         <div class="r">${esc(it.reason)}</div>
         <div class="dim" style="margin-top:3px">${money(it.stake)} \u00B7 ${it.day}</div>
       </div>`
  ).join("")}`;
}

function rulesView(){
  const st = S.settings;
  const mismatch = st.dailyLossCap * 4 > st.monthlyLimit;
  return `
  <div class="dim" style="margin:0 2px 14px">Set these when you're calm. They only work if you don't edit them mid-session.</div>
  <div class="check">
    <div class="field"><label>Exposure cap per match</label><input id="s-mcap" inputmode="numeric" value="${st.perMatchCap}"></div>
    <div class="field"><label>Matches you may trade in a day</label><input id="s-mmax" inputmode="numeric" value="${st.maxMatchesPerDay}"></div>
    <div class="field"><label>Day closes after this many losing bets</label><input id="s-stop" inputmode="numeric" value="${st.lossStopCount}"></div>
    <div class="field"><label>Day closes at this much lost</label><input id="s-dcap" inputmode="numeric" value="${st.dailyLossCap}"></div>
    <div class="field"><label>Monthly loss limit</label><input id="s-mon" inputmode="numeric" value="${st.monthlyLimit}"></div>
    <div class="field" style="margin:0"><label>Session markets</label>
      <select id="s-sess">
        <option value="0" ${st.sessionAllowed?"":"selected"}>Blocked entirely</option>
        <option value="1" ${st.sessionAllowed?"selected":""}>Allowed within the match cap</option>
      </select></div>
  </div>
  ${mismatch?`<div class="check no" style="margin-top:8px"><div class="q">These two don't agree</div>
    <div class="note">Four bad days at ${money(st.dailyLossCap)} would pass your ${money(st.monthlyLimit)} month limit. Raise the month, or lower the day.</div></div>`:""}
  <button class="btn go" id="s-save" style="margin-top:12px">Save rules</button>

  <div class="sect">Backup</div>
  <div class="row">
    <button class="btn ghost grow" id="s-export">Export data</button>
    <button class="btn ghost grow" id="s-import">Restore</button>
  </div>

  <div class="dim" style="margin-top:20px; line-height:1.6">
    If you find yourself widening these numbers after a losing day, that's the signal \u2014 not a settings problem.
    Tele-MANAS, India's free mental-health helpline, is 14416.
  </div>`;
}

/* ---------- wiring ---------- */
function wire(){
  document.querySelectorAll(".tab").forEach(b=> b.onclick = ()=>{ tab=b.dataset.tab; render(); });

  const bind = (id,k)=>{ const e=document.getElementById(id); if(!e) return;
    e.oninput = ()=>{ draft[k]=e.value; softRefresh(); };
    e.onchange= ()=>{ draft[k]=e.value; softRefresh(); };
  };
  bind("f-match","match"); bind("f-stake","stake"); bind("f-reason","reason"); bind("f-market","market");

  document.querySelectorAll("[data-yn]").forEach(b=> b.onclick = ()=>{ answers[b.dataset.yn] = b.dataset.val==="1"; softRefresh(); });

  const p = document.getElementById("place");   if(p) p.onclick = placeBet;
  const s = document.getElementById("stopped"); if(s) s.onclick = recordStop;
  document.querySelectorAll("[data-settle]").forEach(b=> b.onclick = ()=> settleModal(b.dataset.settle));

  const sv = document.getElementById("s-save");
  if(sv) sv.onclick = ()=>{
    const g = id => parseFloat(document.getElementById(id).value)||0;
    S.settings = {
      perMatchCap:      Math.max(1, g("s-mcap")),
      maxMatchesPerDay: Math.max(1, g("s-mmax")),
      lossStopCount:    Math.max(1, g("s-stop")),
      dailyLossCap:     Math.max(1, g("s-dcap")),
      monthlyLimit:     Math.max(1, g("s-mon")),
      sessionAllowed:   document.getElementById("s-sess").value==="1"
    };
    if(save()){ toast("Rules saved."); tab="gate"; render(); }
  };
  const ex = document.getElementById("s-export"); if(ex) ex.onclick = doExport;
  const im = document.getElementById("s-import"); if(im) im.onclick = importModal;
}
function softRefresh(){
  const a = document.activeElement, id = a?a.id:null, pos = a && a.selectionStart;
  render();
  if(id){ const e=document.getElementById(id); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos);}catch(_){} } }
}

function placeBet(){
  S.bets.push({ id:"b"+Date.now(), ts:Date.now(), day:dayKey(), match:draft.match.trim()||"Untitled",
    market:draft.market, stake:parseFloat(draft.stake)||0, reason:draft.reason, result:null, pnl:0 });
  save();
  draft = { stake:"", market:"Match odds", match:"", reason:"" }; answers = {};
  tab="log"; render();
  toast("Logged. Settle it here as soon as it finishes.");
}
function recordStop(){
  const s = stats();
  const failed = s.dayClosed
    ? "Day already closed"
    : evaluate(buildChecks()).failed.map(c=>c.q).join("; ");
  S.blocks.push({ id:"x"+Date.now(), ts:Date.now(), day:dayKey(), stake: parseFloat(draft.stake)||0, failed });
  save();
  draft = { stake:"", market:"Match odds", match:"", reason:"" }; answers = {};
  render();
  toast("Recorded. That's the win today.");
}

function closeModal(){ document.getElementById("modal").innerHTML=""; }

function settleModal(id){
  const b = S.bets.find(x=>x.id===id); if(!b) return;
  document.getElementById("modal").innerHTML = `
  <div class="veil" id="veil"><div class="sheet">
    <h3>Settle this bet</h3>
    <div class="dim" style="margin-bottom:12px">${esc(b.match)} \u00B7 ${money(b.stake)} staked</div>
    <div class="field"><label>Profit if won \u2014 or leave blank and enter odds</label><input id="m-profit" inputmode="numeric" placeholder="e.g. 5950"></div>
    <div class="field"><label>Decimal odds taken</label><input id="m-odds" inputmode="decimal" placeholder="1.85"></div>
    <div class="row" style="margin-top:12px">
      <button class="btn go grow" id="m-won">Won</button>
      <button class="btn stop grow" id="m-lost">Lost</button>
    </div>
    <button class="btn ghost sm" id="m-part" style="margin-top:8px">Partial \u2014 enter exact P&amp;L</button>
    <button class="btn ghost sm" id="m-cancel" style="margin-top:8px">Cancel</button>
  </div></div>`;
  document.getElementById("m-cancel").onclick = closeModal;
  document.getElementById("veil").onclick = e=>{ if(e.target.id==="veil") closeModal(); };
  document.getElementById("m-won").onclick = ()=>{
    const pf = parseFloat(document.getElementById("m-profit").value);
    const o  = parseFloat(document.getElementById("m-odds").value)||0;
    let profit = null;
    if(!isNaN(pf) && pf>0) profit = Math.round(pf);
    else if(o>1) profit = Math.round(b.stake*(o-1));
    if(profit===null){ toast("Enter the profit, or odds above 1.00.", true); return; }
    b.result="WON"; b.pnl = profit; save(); closeModal(); render();
  };
  document.getElementById("m-lost").onclick = ()=>{
    b.result="LOST"; b.pnl = -b.stake; save(); closeModal(); render();
    const s = stats();
    if(s.dayClosed){ tab="gate"; render(); }
  };
  document.getElementById("m-part").onclick = ()=>{
    const pf = parseFloat(document.getElementById("m-profit").value);
    if(isNaN(pf)){ toast("Put the exact result in the profit box \u2014 negative for a loss.", true); return; }
    b.result = pf>=0 ? "WON" : "LOST"; b.pnl = Math.round(pf); save(); closeModal();
    const s = stats(); if(s.dayClosed) tab="gate";
    render();
  };
}

function doExport(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "betgate-backup-" + dayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  toast("Backup downloaded.");
}
function importModal(){
  document.getElementById("modal").innerHTML = `
  <div class="veil" id="veil"><div class="sheet">
    <h3>Restore from backup</h3>
    <div class="dim" style="margin-bottom:12px">This replaces everything currently stored.</div>
    <input type="file" id="m-file" accept="application/json,.json">
    <button class="btn ghost sm" id="m-cancel" style="margin-top:12px">Cancel</button>
  </div></div>`;
  document.getElementById("m-cancel").onclick = closeModal;
  document.getElementById("veil").onclick = e=>{ if(e.target.id==="veil") closeModal(); };
  document.getElementById("m-file").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const d = JSON.parse(rd.result);
        if(!d || !Array.isArray(d.bets)) throw 0;
        S = Object.assign(JSON.parse(JSON.stringify(D)), d);
        S.settings = Object.assign(JSON.parse(JSON.stringify(D.settings)), d.settings||{});
        save(); closeModal(); tab="gate"; render(); toast("Backup restored.");
      }catch(_){ toast("That file isn't a Bet Gate backup.", true); }
    };
    rd.readAsText(f);
  };
}

/* ---------- boot ---------- */
load(); render();
setInterval(()=>{ if(tab==="gate" && dayKey()!==stats().td) render(); }, 60000);
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
